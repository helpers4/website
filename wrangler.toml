name = "helpers4-website"
compatibility_date = "2026-09-01"

# Adding a custom-domain route below makes Cloudflare infer workers_dev = false on deploy, and
# Preview URLs default to matching workers_dev — so without this, PR builds (wrangler versions
# upload) silently stop generating *.workers.dev preview links/PR comments. Preview URLs only
# ever expose *.workers.dev, never the custom domain, so this is safe to force on regardless of
# workers_dev's inferred value.
preview_urls = true

[assets]
directory = "./dist"

# Only the apex — www.helpers4.dev deliberately isn't a route here. It redirects to this domain
# via a Cloudflare Redirect Rule instead (zone-level, see dashboard), so it must NOT also be
# attached directly to this Worker as a Custom Domain — the two would fight over the request.
[[routes]]
pattern = "helpers4.dev"
custom_domain = true
