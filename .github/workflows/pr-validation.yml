name: Pull Request Validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  conventional-commits:
    runs-on: ubuntu-latest
    steps:
      - name: Check conventional commits
        uses: helpers4/action/conventional-commits@main
        with:
          checkout: "true"
          pr-comment: "error"

  build:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN_WEB_AWESOME: ${{ secrets.NPM_TOKEN_WEB_AWESOME }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: helpers4/action/setup-pnpm@main
        with:
          node-version: "24"

      - name: Build all packages
        run: pnpm build

  lighthouse:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN_WEB_AWESOME: ${{ secrets.NPM_TOKEN_WEB_AWESOME }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: helpers4/action/setup-pnpm@main
        with:
          node-version: "24"

      - name: Build all packages
        run: pnpm build

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: "./.lighthouserc.json"
          uploadArtifacts: true
          temporaryPublicStorage: true

  typecheck:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN_WEB_AWESOME: ${{ secrets.NPM_TOKEN_WEB_AWESOME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: helpers4/action/setup-pnpm@main
        with:
          node-version: "24"

      - name: TypeScript check
        run: |
          pnpm run sync
          pnpm exec tsc --noEmit

  pr-comment:
    runs-on: ubuntu-latest
    needs: [conventional-commits, build, typecheck, lighthouse]
    if: always()
    steps:
      - name: Update PR comment
        uses: helpers4/action/pr-status-comment@main
        with:
          jobs: |
            {
              "🧾 Conventional Commits": "${{ needs.conventional-commits.result }}",
              "🏗️ Build": "${{ needs.build.result }}",
              "📘 TypeCheck": "${{ needs.typecheck.result }}",
              "🏮 Lighthouse": "${{ needs.lighthouse.result }}"
            }
