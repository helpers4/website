name: Link Check

on:
  push:
    branches: [main]
    paths:
      - "src/content/docs/**"
  schedule:
    # Weekly, independent of any local change — catches external link rot (a site that moved or
    # disappeared after the fact), not just links that were wrong at merge time.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        env:
          NPM_TOKEN_WEB_AWESOME: ${{ secrets.NPM_TOKEN_WEB_AWESOME }}
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --root-dir "$(pwd)" --no-progress './dist/**/*.html'
          fail: true

      - name: Create issue on failure
        if: failure() && github.event_name == 'schedule'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "🔗 Weekly link check found broken links"
          content-filepath: ./lychee/out.md
          labels: bug, link-rot
