# Config for lycheeverse/lychee-action (see .github/workflows/link-check.yml).
# First-pass config — exclude rules may need tuning once real CI runs surface false positives.

# Accept plain success and rate-limiting (many sites, e.g. npm/GitHub, throttle CI IPs rather
# than reject them outright — a 429 isn't evidence the link is actually dead).
accept = ["200", "429"]

timeout = 20
max_retries = 3
retry_wait_time = 5

# Fragment checking (#section-anchors) is opt-in via include_fragments = "full" — leaving it
# unset keeps it off by default. High false-positive rate on generated docs pages, and a broken
# heading is a content-quality problem, not a link-rot one.

exclude = [
  # Loopback/example placeholders that sometimes show up in code samples, not real links.
  '^https?://localhost',
  '^https?://127\.0\.0\.1',
  '^https?://example\.(com|org)',
  # The site's own absolute URLs (canonical, alternate, sitemap): `pnpm check:links` checks the
  # internal links of the build, and checking the live site from a build of the next one is noise.
  '^https://helpers4\.dev',
  # One "Edit this page" link per docs page and one "Source" link per documented item: about 1 800
  # distinct github.com URLs, which is what got the run rate limited (429 with a 5 minute backoff,
  # 40 minutes in all). They are generated from paths the build itself knows.
  '^https://github\.com/helpers4/[^/]+/(edit|blob|tree)/',
  # Answers 403 to any automated client, from a browser the page is fine.
  '^https://openhub\.net/',
]

exclude_path = [
  # Generated per-version snapshots duplicate the same links as "latest" — checking them all
  # multiplies the run time for zero extra signal.
  "^dist/typescript/v[0-9]+/",
]
